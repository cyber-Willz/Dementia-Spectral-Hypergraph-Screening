[package]
name = "dementia_spec_screen"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "screen"
path = "src/main.rs"

[lib]
name = "dementia_spec_screen"
path = "src/lib.rs"

[dependencies]
spectral_hypergraph = { path = "../spectral_hypergraph" }
neural_hmm = { path = "../neural_hmm" }
burn = { version = "0.13", default-features = false, features = ["ndarray", "autodiff", "std"] }
nalgebra = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1"
tracing = "0.1"
anyhow = "1"

[dev-dependencies]
approx = "0.5"
